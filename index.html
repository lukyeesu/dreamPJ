<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LOGO-Flower2you.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower2you</title>
    <!-- Single Page Apps redirect decode -->
    <script>
      (function(l) {
        // Clean up any corrupted ~and~ or nested /?/ in URL
        if (l.search.indexOf('~and~') !== -1 || l.pathname.indexOf('~and~') !== -1) {
          var cleanPath = l.pathname.split('~and~')[0].split('/?/')[0].replace(/\/+$/, '') || '/';
          window.history.replaceState(null, null, cleanPath + l.hash);
          return;
        }
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
