<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Flower2you</title>
    <script>
      // Single Page Apps for GitHub Pages / Static Hosting
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      // Prevent redirect loop if already contains /?/ or corrupted ~and~
      if (l.search && (l.search[1] === '/' || l.search.indexOf('~and~') !== -1) || l.pathname.indexOf('~and~') !== -1) {
        var cleanPath = l.pathname.split('~and~')[0].split('/?/')[0];
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + (cleanPath || '/'));
      } else {
        var pathSegmentsToKeep = l.pathname.startsWith('/dreamPJ') ? 1 : 0;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
